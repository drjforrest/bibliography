[project]
name = "bibliography"
version = "0.0.1"
description = "Bibliography Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    # chonkie is used for chunking (RecursiveChunker, CodeChunker)
    # chonkie[all] includes sentence-transformers support, but we only need base chonkie for chunking
    # If you need sentence-transformers embeddings, install torch-deps optional group
    "chonkie>=0.1.0",  # Base chonkie works without sentence-transformers for chunking
    "fastapi>=0.115.8",
    "fastapi-users[oauth,sqlalchemy]>=14.0.1",
    "firecrawl-py>=1.12.0",
    "github3.py==4.0.1",
    "langchain-community>=0.3.17",
    "langchain-unstructured>=0.1.6",
    "langgraph>=0.3.29",
    "linkup-sdk>=0.2.4",
    "litellm>=1.61.4",
    "markdownify>=0.14.1",
    "notion-client>=2.3.0",
    "pgvector>=0.3.6",
    "playwright>=1.50.0",
    "python-ffmpeg>=2.0.12",
    "slack-sdk>=3.34.0",
    "static-ffmpeg>=2.13",
    "tavily-python>=0.3.2",
    "unstructured-client>=0.30.0",
    "uvicorn[standard]>=0.34.0",
    "validators>=0.34.0",
    "youtube-transcript-api>=1.0.3",
    "pymupdf>=1.25.0",
    "watchdog>=6.0.0",
    "python-magic>=0.4.27",
    "bibtexparser>=1.4.0",
    "scholarly>=1.7.11",
    "crossref-commons>=0.0.7",
    "httpx>=0.27.2,<0.29.0",
    "numpy<2.0.0",  # PyTorch/rerankers not compatible with NumPy 2.0 yet
    # Torch dependencies are now optional - install with: uv pip install -e ".[torch-deps]"
    # These pull in transformers, which is not needed if using OpenAI-style embeddings
]

[project.optional-dependencies]
# Optional torch dependencies - only install if you need sentence-transformers embeddings or reranking
# Note: On macOS Intel with Python 3.12+, torch requires Python 3.8-3.11
# Install with: uv pip install -e ".[torch-deps]"
torch-deps = [
    "torch>=2.0.0",
    "rerankers[flashrank]>=0.7.1",
    "sentence-transformers>=3.4.1",
    "unstructured[all-docs]>=0.16.25",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["db*", "data*", "tests*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"